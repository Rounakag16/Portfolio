<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2d"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f5c451"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="140" fill="#ffdd80" opacity="0.06"/>
  <circle cx="90" cy="360" r="180" fill="#ffdd80" opacity="0.05"/>

  <!-- network / dispute-resolution motif -->
  <g stroke="#f5c451" stroke-width="2" opacity="0.55">
    <line x1="120" y1="120" x2="230" y2="90"/>
    <line x1="230" y1="90" x2="330" y2="150"/>
    <line x1="120" y1="120" x2="330" y2="150"/>
  </g>
  <circle cx="120" cy="120" r="7" fill="#f5c451"/>
  <circle cx="230" cy="90" r="7" fill="#f5c451"/>
  <circle cx="330" cy="150" r="7" fill="#f5c451"/>

  <text x="60" y="250" font-family="'Poppins', Arial, sans-serif" font-size="56" font-weight="600" fill="#ffffff">FriendFi</text>
  <text x="60" y="288" font-family="'Poppins', Arial, sans-serif" font-size="20" font-weight="400" fill="url(#accent)">Anti-Bullying DAO Platform</text>

  <g font-family="'Poppins', Arial, sans-serif" font-size="14" font-weight="500" fill="#1a1a1c">
    <rect x="60" y="315" width="88" height="30" rx="15" fill="#ffe9a8"/>
    <text x="104" y="335" text-anchor="middle">Node.js</text>

    <rect x="158" y="315" width="94" height="30" rx="15" fill="#ffe9a8"/>
    <text x="205" y="335" text-anchor="middle">Socket.io</text>

    <rect x="262" y="315" width="98" height="30" rx="15" fill="#ffe9a8"/>
    <text x="311" y="335" text-anchor="middle">MongoDB</text>
  </g>
</svg>
