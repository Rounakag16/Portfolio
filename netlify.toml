# rounak.tech on Netlify (project "rounakagportfolio"), built from the main branch on GitHub.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"

# Pinned on purpose: Netlify's automatic detection skipped this runtime once, which published
# .next as plain static files and turned every URL into a 404. Keep it here and in devDependencies.
[[plugins]]
  package = "@netlify/plugin-nextjs"
